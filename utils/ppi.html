<style type="text/css">

        #mynetwork {
            width: 500px;
            height: 500px;
            background-color: #ffffff;
            border: 1px solid lightgray;
            position: relative;
            float: left;

<body>
<div id = "mynetwork"></div>


<script type="text/javascript">

    // initialize global variables.
    var edges;
    var nodes;
    var network; 
    var container;
    var options, data;

    
    // This method is responsible for drawing the graph, returns the drawn network
    function drawGraph() {
        var container = document.getElementById('mynetwork');
        
        

        // parsing and collecting nodes and edges from the python
        nodes = new vis.DataSet([{"color": "#42687d", "id": "IL3RA", "label": "IL3RA", "shape": "dot"}, {"color": "#c6f13e", "id": "CSF2RB", "label": "CSF2RB", "shape": "dot"}, {"color": "#7414eb", "id": "CSF2", "label": "CSF2", "shape": "dot"}, {"color": "#21806a", "id": "IL6", "label": "IL6", "shape": "dot"}, {"color": "#d16e5d", "id": "STAT5B", "label": "STAT5B", "shape": "dot"}, {"color": "#a1f441", "id": "STAT5A", "label": "STAT5A", "shape": "dot"}, {"color": "#ef7bf5", "id": "JAK2", "label": "JAK2", "shape": "dot"}, {"color": "#7ee88", "id": "IL11", "label": "IL11", "shape": "dot"}, {"color": "#f9bab8", "id": "CSF3", "label": "CSF3", "shape": "dot"}, {"color": "#e79411", "id": "SHC1", "label": "SHC1", "shape": "dot"}, {"color": "#ae867d", "id": "IL3", "label": "IL3", "shape": "dot"}, {"color": "#b92556", "id": "GRB2", "label": "GRB2", "shape": "dot"}, {"color": "#55f176", "id": "GAB2", "label": "GAB2", "shape": "dot"}, {"color": "#32a7c8", "id": "PTPN11", "label": "PTPN11", "shape": "dot"}, {"color": "#81edd4", "id": "INPP5D", "label": "INPP5D", "shape": "dot"}, {"color": "#300ad4", "id": "LEPR", "label": "LEPR", "shape": "dot"}, {"color": "#db10c6", "id": "STAT3", "label": "STAT3", "shape": "dot"}, {"color": "#ebd62e", "id": "SOCS3", "label": "SOCS3", "shape": "dot"}, {"color": "#566d2d", "id": "PRLR", "label": "PRLR", "shape": "dot"}, {"color": "#aa70ce", "id": "EPOR", "label": "EPOR", "shape": "dot"}, {"color": "#d9fd9f", "id": "IRS1", "label": "IRS1", "shape": "dot"}, {"color": "#ff61d1", "id": "STAT1", "label": "STAT1", "shape": "dot"}, {"color": "#1c7dcb", "id": "IFNGR1", "label": "IFNGR1", "shape": "dot"}, {"color": "#b5a55b", "id": "IL5RA", "label": "IL5RA", "shape": "dot"}, {"color": "#223ade", "id": "CSF2RA", "label": "CSF2RA", "shape": "dot"}, {"color": "#2da53f", "id": "IL5", "label": "IL5", "shape": "dot"}, {"color": "#2c5834", "id": "PTPN6", "label": "PTPN6", "shape": "dot"}]);
        edges = new vis.DataSet([{"from": "IL3", "to": "IL3RA", "value": 0.0999}, {"from": "IL3", "to": "CSF2RB", "value": 0.0999}, {"from": "IL3", "to": "CSF2", "value": 0.0994}, {"from": "IL3", "to": "IL6", "value": 0.09759999999999999}, {"from": "IL3", "to": "STAT5B", "value": 0.0969}, {"from": "IL3", "to": "STAT5A", "value": 0.0969}, {"from": "IL3", "to": "JAK2", "value": 0.09659999999999999}, {"from": "IL3", "to": "IL11", "value": 0.09609999999999999}, {"from": "IL3", "to": "CSF3", "value": 0.0959}, {"from": "IL3", "to": "SHC1", "value": 0.0954}, {"from": "IL3RA", "to": "CSF2RB", "value": 0.0998}, {"from": "IL3RA", "to": "JAK2", "value": 0.0949}, {"from": "IL3RA", "to": "GRB2", "value": 0.09419999999999999}, {"from": "IL3RA", "to": "STAT5A", "value": 0.09330000000000001}, {"from": "IL3RA", "to": "STAT5B", "value": 0.0931}, {"from": "IL3RA", "to": "GAB2", "value": 0.09280000000000001}, {"from": "IL3RA", "to": "PTPN11", "value": 0.09190000000000001}, {"from": "IL3RA", "to": "CSF2", "value": 0.0911}, {"from": "IL3RA", "to": "INPP5D", "value": 0.0911}, {"from": "JAK2", "to": "LEPR", "value": 0.0999}, {"from": "JAK2", "to": "STAT3", "value": 0.0999}, {"from": "JAK2", "to": "SOCS3", "value": 0.0999}, {"from": "JAK2", "to": "STAT5A", "value": 0.0999}, {"from": "JAK2", "to": "PRLR", "value": 0.0999}, {"from": "JAK2", "to": "EPOR", "value": 0.0999}, {"from": "JAK2", "to": "IRS1", "value": 0.0999}, {"from": "JAK2", "to": "GRB2", "value": 0.0999}, {"from": "JAK2", "to": "STAT1", "value": 0.0999}, {"from": "JAK2", "to": "IFNGR1", "value": 0.0999}, {"from": "CSF2RB", "to": "CSF2", "value": 0.0999}, {"from": "CSF2RB", "to": "JAK2", "value": 0.0996}, {"from": "CSF2RB", "to": "IL5RA", "value": 0.0993}, {"from": "CSF2RB", "to": "SHC1", "value": 0.0993}, {"from": "CSF2RB", "to": "CSF2RA", "value": 0.0993}, {"from": "CSF2RB", "to": "IL5", "value": 0.0989}, {"from": "CSF2RB", "to": "PTPN6", "value": 0.0989}, {"from": "CSF2RB", "to": "PTPN11", "value": 0.0984}]);

        // adding nodes and edges to the graph
        data = {nodes: nodes, edges: edges};

        var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": false,
            "type": "continuous"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};
        
        

        

        network = new vis.Network(container, data, options);
	 
        


        

        return network;

    }

    drawGraph();

</script>
</body>
</html>
